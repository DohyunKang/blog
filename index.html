<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도현의 블로그</title>
<meta name="description" content="만들면서 배운 것들을 적어 둡니다 — 강도현">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--sans:"SUIT Variable",SUIT,-apple-system,"Malgun Gothic",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;
--bg:#ECEEF2;--paper:#fff;--ink:#1A1D23;--sub:#4A5260;--faint:#7F8794;--line:#DADEE5;--accent:#2F47C6;--soft:#E4E8F8;--code:#F3F4F8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#24272E;--paper:#2D3139;--ink:#F2F4F7;--sub:#C3C9D2;--faint:#8F97A3;--line:#3B4049;--accent:#A3B4FF;--soft:#343C5C;--code:#23262D}}
:root[data-theme=dark]{--bg:#24272E;--paper:#2D3139;--ink:#F2F4F7;--sub:#C3C9D2;--faint:#8F97A3;--line:#3B4049;--accent:#A3B4FF;--soft:#343C5C;--code:#23262D}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.8 var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:8px;height:62px}
.logo{font:italic 1.6rem var(--serif);color:var(--accent)}
.sp{flex:1}
.pill{font-size:.85rem;font-weight:700;color:var(--sub);padding:6px 13px;border-radius:999px;white-space:nowrap}
.pill:hover{background:var(--paper)}
.pill.pf{background:var(--accent);color:var(--paper)}
.theme{border:0;background:var(--paper);color:var(--sub);width:34px;height:34px;border-radius:50%;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12);flex:none}
.hero{padding:48px 0 18px}
.hero h1{margin:0;font:italic 400 clamp(2.4rem,7vw,3.4rem)/1.05 var(--serif);letter-spacing:-.01em}
.hero p{margin:10px 0 0;color:var(--sub)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:22px 0 10px}
.tools input{flex:1;min-width:160px;font:inherit;font-size:.95rem;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
.tag{font-size:.8rem;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--paper);color:var(--sub);border:0;cursor:pointer;font-family:inherit}
.tag.on{background:var(--ink);color:var(--bg)}
.card{display:block;background:var(--paper);border-radius:14px;padding:20px 22px;margin:12px 0;box-shadow:0 1px 2px rgba(26,29,35,.05),0 14px 34px -22px rgba(26,29,35,.28);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card h2{margin:0;font-size:1.2rem;line-height:1.4}
.card p{margin:6px 0 10px;color:var(--sub);font-size:.95rem}
.meta{font-size:.82rem;color:var(--faint)}
.meta i{font-style:normal;color:var(--accent);font-weight:700;margin-left:8px}
.empty{color:var(--faint);padding:30px 0;text-align:center}
article{background:var(--paper);border-radius:14px;padding:34px 36px;margin:20px 0 40px;box-shadow:0 14px 34px -22px rgba(26,29,35,.28)}
article h1{font-size:1.9rem;line-height:1.35;margin:0 0 8px;letter-spacing:-.02em}
article .meta{margin-bottom:26px}
article h2{font-size:1.3rem;margin:2em 0 .5em}article h3{font-size:1.1rem;margin:1.6em 0 .4em}
article a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
article img{max-width:100%;border-radius:10px}
article code{background:var(--code);padding:2px 6px;border-radius:6px;font-size:.88em}
article pre{background:var(--code);padding:16px 18px;border-radius:10px;overflow-x:auto;line-height:1.55}
article pre code{background:none;padding:0}
article blockquote{margin:1.2em 0;padding:2px 18px;border-left:3px solid var(--accent);color:var(--sub)}
article table{border-collapse:collapse;width:100%}article th,article td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.back{display:inline-block;margin-top:18px;font-weight:700;color:var(--sub);font-size:.9rem}
footer{padding:30px 0 50px;text-align:center;color:var(--faint);font-size:.85rem}
@media (max-width:600px){article{padding:24px 18px}.pill{padding:6px 9px}.logo{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="#/">dohyun's log</a><span class="sp"></span>
  <a class="pill pf" href="https://dohyunkang.github.io/">포트폴리오</a>
  <a class="pill" href="https://github.com/DohyunKang">GitHub</a>
  <button class="theme" id="theme" type="button" aria-label="밝게/어둡게 바꾸기">◐</button>
</header>
<main id="app"></main>
<footer>© 2026 강도현 · <a href="https://dohyunkang.github.io/">포트폴리오</a> · <a href="https://github.com/DohyunKang">GitHub</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function(){
  var app=document.getElementById('app'),posts=[],tag='',q='';
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var root=document.documentElement,t=document.getElementById('theme');
  try{var s=localStorage.getItem('theme');if(s)root.dataset.theme=s}catch(e){}
  t.onclick=function(){var d=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);root.dataset.theme=d?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}};
  function chips(p){return p.tags.map(function(x){return'<i>#'+esc(x)+'</i>'}).join('')}
  function list(){
    document.title='도현의 블로그';
    var tags=[];
    posts.forEach(function(p){p.tags.forEach(function(x){if(tags.indexOf(x)<0)tags.push(x)})});
    var shown=posts.filter(function(p){return(!tag||p.tags.indexOf(tag)>=0)&&(!q||(p.title+p.summary+p.tags.join(' ')).toLowerCase().indexOf(q)>=0)});
    app.innerHTML='<section class="hero"><h1>만들면서 배운 것들</h1><p>직접 해 보고, 막히고, 알게 된 것을 적어 둡니다.</p></section>'+
      '<div class="tools"><input id="q" type="search" placeholder="글 검색" value="'+esc(q)+'">'+
      '<button class="tag'+(tag?'':' on')+'" data-t="">전체</button>'+tags.map(function(x){return'<button class="tag'+(x===tag?' on':'')+'" data-t="'+esc(x)+'">#'+esc(x)+'</button>'}).join('')+'</div>'+
      (shown.length?shown.map(function(p){return'<a class="card" href="#/post/'+encodeURIComponent(p.slug)+'"><h2>'+esc(p.title)+'</h2><p>'+esc(p.summary)+'</p><span class="meta">'+esc(p.date)+chips(p)+'</span></a>'}).join(''):'<p class="empty">맞는 글이 없어요.</p>');
    var qi=document.getElementById('q');
    qi.oninput=function(){q=qi.value.trim().toLowerCase();var pos=qi.selectionStart;list();var n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
    [].forEach.call(app.querySelectorAll('.tag'),function(b){b.onclick=function(){tag=b.dataset.t;list()}});
  }
  function post(slug){
    var p=posts.filter(function(x){return x.slug===slug})[0];
    if(!p){app.innerHTML='<p class="empty">글을 찾을 수 없어요.</p><a class="back" href="#/">← 목록</a>';return}
    document.title=p.title+' · 도현의 블로그';
    app.innerHTML='<a class="back" href="#/">← 목록</a><article><h1>'+esc(p.title)+'</h1><div class="meta">'+esc(p.date)+chips(p)+'</div><div id="body">불러오는 중…</div></article>';
    fetch('posts/'+encodeURIComponent(p.slug)+'.md').then(function(r){return r.text()}).then(function(md){document.getElementById('body').innerHTML=marked.parse(md);scrollTo(0,0)});
  }
  function route(){var m=location.hash.match(/^#\/post\/(.+)$/);m?post(decodeURIComponent(m[1])):list()}
  fetch('posts/index.json').then(function(r){return r.json()}).then(function(d){posts=d.sort(function(a,b){return a.date<b.date?1:-1});route()});
  addEventListener('hashchange',route);
})();
</script>
</body>
</html>
